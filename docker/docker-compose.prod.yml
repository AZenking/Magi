# Magi 生产部署配置
# 使用方法：
#   1. 复制 .env.example 为 .env 并修改配置
#   2. docker compose up -d
#   3. 首次部署执行迁移和种子：
#      docker compose exec api sh -c "npx drizzle-kit migrate"
#      docker compose exec api node dist/seed.js

services:
  postgres:
    image: postgres:16-alpine
    container_name: magi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magi}
      POSTGRES_DB: ${POSTGRES_DB:-magi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - magi

  redis:
    image: redis:7-alpine
    container_name: magi-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - magi

  api:
    image: ghcr.io/azenking/magi/api:${MAGI_VERSION:-latest}
    container_name: magi-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-magi}:${POSTGRES_PASSWORD:-magi}@postgres:5432/${POSTGRES_DB:-magi}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      MAGI_ADMIN_USERNAME: ${MAGI_ADMIN_USERNAME:-admin}
      MAGI_ADMIN_PASSWORD: ${MAGI_ADMIN_PASSWORD:?MAGI_ADMIN_PASSWORD is required}
      MAGI_ADMIN_EMAIL: ${MAGI_ADMIN_EMAIL:-admin@magi.local}
      MAGI_ADMIN_NAME: ${MAGI_ADMIN_NAME:-Admin}
    volumes:
      - logo_uploads:/app/uploads/logos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - magi

  worker:
    image: ghcr.io/azenking/magi/worker:${MAGI_VERSION:-latest}
    container_name: magi-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-magi}:${POSTGRES_PASSWORD:-magi}@postgres:5432/${POSTGRES_DB:-magi}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - magi

  web:
    image: ghcr.io/azenking/magi/web:${MAGI_VERSION:-latest}
    container_name: magi-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api
    networks:
      - magi

volumes:
  postgres_data:
  redis_data:
  logo_uploads:

networks:
  magi:
    driver: bridge
