# Server deployment: pull images published by GitHub Actions. No source build
# toolchain is needed on the server. Set IMAGE_PREFIX in docker/.env.prod.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/magi-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/magi-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:?PUBLIC_API_HOST is required}
      SCHEDULE_STREAM_CHECK: ${SCHEDULE_STREAM_CHECK:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOGO_UPLOAD_DIR: /app/uploads/logos
      BACKUP_STORAGE_ROOT: /app/data/backups
      MAGI_ADMIN_USERNAME: ${MAGI_ADMIN_USERNAME:?MAGI_ADMIN_USERNAME is required}
      MAGI_ADMIN_PASSWORD: ${MAGI_ADMIN_PASSWORD:?MAGI_ADMIN_PASSWORD is required}
      MAGI_ADMIN_EMAIL: ${MAGI_ADMIN_EMAIL:?MAGI_ADMIN_EMAIL is required}
      MAGI_ADMIN_NAME: ${MAGI_ADMIN_NAME:?MAGI_ADMIN_NAME is required}
    volumes:
      - logo_uploads:/app/uploads/logos
      - backup_data:/app/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/magi-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/magi-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_PORT: ${API_PORT:?API_PORT is required}
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - api

  seed:
    profiles: ["setup"]
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/magi-migrate:${IMAGE_TAG:-latest}
    command: ["sh", "scripts/with-env.sh", "pnpm", "--filter", "@magi/api", "exec", "tsx", "src/seed.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MAGI_ADMIN_USERNAME: ${MAGI_ADMIN_USERNAME:?MAGI_ADMIN_USERNAME is required}
      MAGI_ADMIN_PASSWORD: ${MAGI_ADMIN_PASSWORD:?MAGI_ADMIN_PASSWORD is required}
      MAGI_ADMIN_EMAIL: ${MAGI_ADMIN_EMAIL:?MAGI_ADMIN_EMAIL is required}
      MAGI_ADMIN_NAME: ${MAGI_ADMIN_NAME:?MAGI_ADMIN_NAME is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  logo_uploads:
  backup_data:
