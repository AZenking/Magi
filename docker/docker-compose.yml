services:
  postgres:
    image: postgres:16-alpine
    container_name: magi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magi}
      POSTGRES_DB: ${POSTGRES_DB:-magi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: magi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: magi-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-magi}:${POSTGRES_PASSWORD:-magi}@postgres:5432/${POSTGRES_DB:-magi}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      MAGI_ADMIN_USERNAME: ${MAGI_ADMIN_USERNAME}
      MAGI_ADMIN_PASSWORD: ${MAGI_ADMIN_PASSWORD}
      MAGI_ADMIN_EMAIL: ${MAGI_ADMIN_EMAIL}
      MAGI_ADMIN_NAME: ${MAGI_ADMIN_NAME}
    volumes:
      - logo_uploads:/app/uploads/logos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: magi-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-magi}:${POSTGRES_PASSWORD:-magi}@postgres:5432/${POSTGRES_DB:-magi}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: magi-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  logo_uploads:
