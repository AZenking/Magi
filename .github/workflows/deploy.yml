name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BETTER_AUTH_SECRET: build-placeholder-secret
  MAGI_ADMIN_USERNAME: build-admin
  MAGI_ADMIN_PASSWORD: build-placeholder-password
  MAGI_ADMIN_EMAIL: build@example.invalid
  MAGI_ADMIN_NAME: Build Admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker image variables
        id: image
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "DOCKER_REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker compose -f docker/docker-compose.yml build
          docker compose -f docker/docker-compose.yml push

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.DOCKER_API_KEY }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_REGISTRY=${{ steps.image.outputs.registry }}
            export DOCKER_TAG=${{ steps.image.outputs.tag }}
            docker compose -f docker/docker-compose.yml pull
            docker compose -f docker/docker-compose.yml up -d --remove-orphans
            docker compose -f docker/docker-compose.yml exec -T api sh -c "npx drizzle-kit migrate"
            docker image prune -f
