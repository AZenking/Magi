name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BETTER_AUTH_SECRET: build-placeholder-secret
  MAGI_ADMIN_USERNAME: build-admin
  MAGI_ADMIN_PASSWORD: build-placeholder-password
  MAGI_ADMIN_EMAIL: build@example.invalid
  MAGI_ADMIN_NAME: Build Admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker image variables
        id: image
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(jq -r .version package.json)
          short_sha=$(git rev-parse --short=8 HEAD)
          major=$(echo "$version" | cut -d. -f1)
          major_minor=$(echo "$version" | cut -d. -f1,2)
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${version},${major_minor},${major},latest,${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          export DOCKER_REGISTRY=${{ steps.image.outputs.registry }}
          export DOCKER_TAG=${{ steps.image.outputs.short_sha }}
          docker compose -f docker/docker-compose.yml build

          TAGS="${{ steps.image.outputs.tags }}"
          for svc in api worker web; do
            source="${DOCKER_REGISTRY}/${svc}:${DOCKER_TAG}"
            for tag in ${TAGS//,/ }; do
              target="${DOCKER_REGISTRY}/${svc}:${tag}"
              docker tag "$source" "$target"
            done
            docker push --all-tags "${DOCKER_REGISTRY}/${svc}"
          done
