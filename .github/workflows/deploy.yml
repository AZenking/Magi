name: Publish container images

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Read package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version must be Docker-tag-safe SemVer: $version" >&2
            exit 1
          fi

          version_changed=true
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] && git cat-file -e HEAD^:package.json 2>/dev/null; then
            previous="$(git show HEAD^:package.json | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                try { process.stdout.write(String(JSON.parse(input).version ?? "")); }
                catch { process.stdout.write(""); }
              });
            ')"
            [[ "$previous" != "$version" ]] || version_changed=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (version tag enabled: $version_changed)"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: magi-api
            dockerfile: docker/api.Dockerfile
            target: runner
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: magi-api
            dockerfile: docker/api.Dockerfile
            target: runner
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: magi-migrate
            dockerfile: docker/api.Dockerfile
            target: migrate
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: magi-migrate
            dockerfile: docker/api.Dockerfile
            target: migrate
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: magi-worker
            dockerfile: docker/worker.Dockerfile
            target: runner
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: magi-worker
            dockerfile: docker/worker.Dockerfile
            target: runner
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: magi-web
            dockerfile: docker/web.Dockerfile
            target: runner
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: magi-web
            dockerfile: docker/web.Dockerfile
            target: runner
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}-${{ matrix.arch }}
            type=raw,value=${{ needs.version.outputs.version }}-${{ matrix.arch }},enable=${{ needs.version.outputs.version_changed == 'true' }}

      - name: Build and publish ${{ matrix.image }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish ${{ matrix.image }} manifest
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        image: [magi-api, magi-migrate, magi-worker, magi-web]

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          VERSION_CHANGED: ${{ needs.version.outputs.version_changed }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          tags=(
            --tag "${image}:latest"
            --tag "${image}:sha-${GITHUB_SHA}"
          )
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            tags+=(--tag "${image}:${APP_VERSION}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${image}:sha-${GITHUB_SHA}-amd64" \
            "${image}:sha-${GITHUB_SHA}-arm64"
